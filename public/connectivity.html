<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection check</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --mut:#666; --card:#f5f5f5; --ok:#0a7d32; --bad:#b00020; --warn:#8a5a00; --line:#e3e3e3; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#15171a; --fg:#e8e8e8; --mut:#9aa0a6; --card:#1e2127; --ok:#5fd27a; --bad:#ff6b7f; --warn:#e0b050; --line:#2b2f36; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:24px 16px; }
  main { max-width:420px; margin:0 auto; text-align:center; }
  .spinner { width:38px; height:38px; margin:22px auto; border-radius:50%; border:3px solid var(--line); border-top-color:var(--mut); animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .big { font-size:19px; font-weight:700; margin:14px 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin:0 0 4px; }
  .result { display:none; }
  .result.show { display:block; }
  .badge { font-size:40px; line-height:1; margin:10px 0; }
  .result.ok .big { color:var(--ok); }
  .result.bad .big { color:var(--bad); }
  .result.unknown .big { color:var(--warn); }
  button { margin-top:18px; background:transparent; color:var(--mut); border:1px solid var(--line); border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; }
</style>
</head>
<body>
<main>
  <div id="loading">
    <div class="spinner"></div>
    <div class="big">Checking your connection…</div>
    <div class="sub" id="step">Starting checks</div>
  </div>

  <div class="result" id="result">
    <div class="badge" id="badge"></div>
    <div class="big" id="rbig"></div>
    <div class="sub" id="rsub"></div>
    <button id="again">Check again</button>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const tg = window.Telegram && window.Telegram.WebApp;

// Probe targets are NOT hard-coded in this page: they come from the Worker's /api/config
// (env secrets), so no specific domain identifies the deployment. Fallbacks are generic
// public domains used only when config is unreachable.
let directDomain = null;   // a plainly-reachable domain -> baseline internet is up
let proxiedDomain = null;  // a domain that only answers when traffic rides the tunnel

async function getJson(url, ms) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms || 6000);
  try { const r = await fetch(url, { signal:c.signal, cache:'no-store' }); return await r.json(); }
  finally { clearTimeout(t); }
}

async function loadConfig() {
  try {
    const c = await getJson('/api/config', 4000);
    if (c) {
      if (c.directDomain) directDomain = String(c.directDomain);
      if (c.proxiedDomain) proxiedDomain = String(c.proxiedDomain);
    }
  } catch {}
  // Generic fallbacks (no service identity) if config is unavailable.
  if (!directDomain) directDomain = 'example.com';
  if (!proxiedDomain) proxiedDomain = 'instagram.com';
}

// Reachability without CORS: load a tiny image off the host. onload OR onerror both mean the
// host answered (reachable); only a timeout means it did not. Mirrors the leak-probe's method.
function reachable(host, ms) {
  return new Promise((resolve) => {
    const h = String(host || '').trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
    if (!h) return resolve(false);
    const img = new Image(); let done = false;
    const fin = (ok) => { if (done) return; done = true; resolve(ok); };
    img.onload = () => fin(true); img.onerror = () => fin(true);
    setTimeout(() => fin(false), ms || 6000);
    img.src = `https://${h}/favicon.ico?cb=${Date.now()}`;
  });
}

// Best-effort ASN of the current egress, for the control-side verdict. Optional: if every
// lookup is blocked we simply omit it and let control derive ASN from the request IP.
async function probeAsn() {
  try {
    const d = await getJson('https://ipwho.is/', 5000);
    const asn = d && d.connection && d.connection.asn;
    return Number.isFinite(asn) ? (asn >>> 0) : null;
  } catch { return null; }
}

function paint(kind, badge, title, sub) {
  $('loading').style.display = 'none';
  const r = $('result');
  r.className = 'result show ' + kind;
  $('badge').textContent = badge;
  $('rbig').textContent = title;
  $('rsub').textContent = sub;
}

async function run() {
  $('loading').style.display = '';
  $('result').className = 'result';
  $('step').textContent = 'Starting checks';
  try { if (tg) tg.ready(); } catch {}

  await loadConfig();

  $('step').textContent = 'Checking baseline internet';
  const direct_ok = await reachable(directDomain, 6000);

  $('step').textContent = 'Checking the tunnel';
  const proxied_ok = await reachable(proxiedDomain, 6000);

  $('step').textContent = 'Finishing up';
  const asn = await probeAsn();

  // One App signal to the control plane, via the same-origin BFF which validates initData.
  // initData is Telegram's signed payload; without it (opened outside Telegram) we can still
  // show the user a verdict but cannot report.
  const initData = (tg && tg.initData) ? tg.initData : '';
  let reported = false;
  if (initData) {
    try {
      const body = { initData, direct_ok, proxied_ok };
      if (asn != null) body.asn = asn;
      const r = await fetch('/api/connectivity', {
        method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body),
      });
      reported = r.ok;
    } catch {}
  }

  if (proxied_ok) {
    paint('ok', '✓', 'You’re connected', 'Your connection is working normally.');
  } else if (direct_ok) {
    paint('bad', '!', 'Connection problem',
      'The internet is reachable, but the secure route is not responding right now. Try reconnecting.');
  } else {
    paint('unknown', '…', 'No internet',
      'We couldn’t reach the network from this device. Check your connection and try again.');
  }
  // reported is intentionally not surfaced: the user cares about their connection, not the signal.
  void reported;
}

$('again').addEventListener('click', run);
run();
</script>
</body>
</html>
